<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pr. Ben-Hur dos Santos — E-books cristãos</title>
<meta name="description" content="E-books de estudos bíblicos do Pr. Ben-Hur dos Santos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0b0f1a; --night-2:#121829; --night-3:#1a2238;
  --gold:#e3b34c; --gold-2:#f5d27a; --gold-deep:#b9862a;
  --ink:#f3ecdc; --muted:#b9b2a2; --line:rgba(227,179,76,.22);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--night);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:0 22px}
.serif{font-family:Lora,Georgia,serif}
.display{font-family:Cinzel,Georgia,serif;letter-spacing:.02em}
.eyebrow{font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(11,15,26,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand-mark{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px}
.brand b{font-family:Cinzel,serif;font-weight:700;font-size:1rem;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.nav-links{display:flex;gap:28px;font-size:.92rem}
.nav-links a{text-decoration:none;color:var(--muted);transition:color .2s}
.nav-links a:hover{color:var(--gold-2)}
.cart-btn{position:relative;display:flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer;transition:border-color .2s,background .2s}
.cart-btn:hover{border-color:var(--gold);background:rgba(227,179,76,.08)}
.cart-btn svg{width:18px;height:18px}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:#1a1205;font-size:.72rem;font-weight:700;display:grid;place-items:center;padding:0 6px}
.badge.zero{background:var(--night-3);color:var(--muted)}

/* hero */
.hero{position:relative;overflow:hidden;padding:84px 0 96px;
  background:
    radial-gradient(900px 500px at 78% 30%,rgba(227,179,76,.20),transparent 60%),
    radial-gradient(700px 400px at 10% 90%,rgba(80,100,170,.18),transparent 60%),
    linear-gradient(180deg,#0b0f1a 0%,#10172a 100%)}
.stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 60% 12%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 85% 60%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 40% 75%,#fff4 50%,transparent 51%),radial-gradient(1px 1px at 8% 55%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 72% 85%,#fff3 50%,transparent 51%);pointer-events:none}
.hero-grid{position:relative;display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
.hero h1{font-family:Cinzel,serif;font-weight:700;font-size:clamp(2.2rem,4.6vw,3.6rem);line-height:1.08;margin:16px 0 20px}
.hero h1 em{font-style:normal;background:linear-gradient(180deg,var(--gold-2),var(--gold-deep));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-family:Lora,serif;font-size:1.18rem;color:#d9d1bf;max-width:34ch}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:14px 26px;font:inherit;font-weight:600;font-size:.96rem;cursor:pointer;text-decoration:none;border:0;transition:transform .15s,box-shadow .2s,background .2s}
.btn:active{transform:translateY(1px)}
.btn-gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#1a1205;box-shadow:0 6px 24px -8px rgba(227,179,76,.7)}
.btn-gold:hover{box-shadow:0 10px 30px -8px rgba(227,179,76,.9)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--gold)}
.hero-note{margin-top:22px;font-size:.86rem;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}
.hero-note span{display:flex;align-items:center;gap:6px}
.hero-note svg{width:15px;height:15px;color:var(--gold)}

.fan{position:relative;height:440px}
.fan img{position:absolute;width:56%;max-width:270px;border-radius:6px;box-shadow:0 30px 60px -20px #000,0 0 0 1px rgba(255,255,255,.06);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.fan .f1{left:2%;top:46px;transform:rotate(-9deg)}
.fan .f2{left:22%;top:0;z-index:2;transform:rotate(0)}
.fan .f3{right:2%;top:46px;transform:rotate(9deg)}
.fan:hover .f1{transform:rotate(-13deg) translateX(-14px)}
.fan:hover .f3{transform:rotate(13deg) translateX(14px)}
.fan:hover .f2{transform:translateY(-10px)}

/* sections */
section{padding:88px 0}
.sec-head{text-align:center;max-width:640px;margin:0 auto 52px}
.sec-head h2{font-family:Cinzel,serif;font-size:clamp(1.8rem,3.4vw,2.5rem);margin:10px 0 12px;font-weight:700}
.sec-head p{color:var(--muted);font-family:Lora,serif;font-size:1.06rem}
.divider{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);margin-top:14px}
.divider::before,.divider::after{content:"";height:1px;width:60px;background:linear-gradient(90deg,transparent,var(--gold))}
.divider::after{transform:scaleX(-1)}

/* products */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.card{background:linear-gradient(180deg,var(--night-2),#0e1322);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);border-color:rgba(227,179,76,.5);box-shadow:0 24px 50px -24px rgba(0,0,0,.8)}
.cover-box{position:relative;padding:28px 28px 0;background:radial-gradient(300px 200px at 50% 70%,rgba(227,179,76,.16),transparent 70%)}
.cover-box img{width:72%;margin:0 auto;border-radius:4px;box-shadow:0 18px 40px -14px #000;aspect-ratio:2/3;object-fit:cover;cursor:pointer}
.tag{position:absolute;top:16px;left:16px;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:#1a1205;padding:5px 10px;border-radius:999px}
.tag.alt{background:var(--night-3);color:var(--gold-2);border:1px solid var(--line)}
.card-body{padding:24px 24px 26px;display:flex;flex-direction:column;flex:1}
.vol{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.card h3{font-family:Cinzel,serif;font-size:1.28rem;line-height:1.2;margin:8px 0 6px}
.card .sub{font-family:Lora,serif;font-style:italic;color:#cfc7b5;font-size:.98rem}
.card .desc{color:var(--muted);font-size:.92rem;margin:14px 0 18px;flex:1}
.meta{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-bottom:18px}
.meta span{display:flex;align-items:center;gap:5px}
.meta svg{width:14px;height:14px;color:var(--gold)}
.buy{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:18px}
.price{font-family:Cinzel,serif;font-weight:700;font-size:1.6rem;color:var(--gold-2);line-height:1}
.price small{display:block;font-family:Inter,sans-serif;font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:.06em;margin-bottom:4px}
.add{padding:11px 18px;font-size:.88rem}
.add.added{background:#2c3a26;color:#cfe8b8;box-shadow:none}
.link-btn{background:none;border:0;color:var(--gold-2);font:inherit;font-size:.86rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px;align-self:flex-start;margin-bottom:16px;padding:0}

/* combo */
.combo{margin-top:34px;border:1px solid rgba(227,179,76,.5);border-radius:calc(var(--radius) + 4px);padding:34px 38px;display:grid;grid-template-columns:auto 1fr auto;gap:34px;align-items:center;background:linear-gradient(110deg,rgba(227,179,76,.13),rgba(227,179,76,.03) 60%),var(--night-2)}
.combo-covers{display:flex}
.combo-covers img{width:74px;border-radius:3px;box-shadow:0 10px 20px -8px #000;margin-left:-22px;aspect-ratio:2/3;object-fit:cover}
.combo-covers img:first-child{margin-left:0;transform:rotate(-6deg)}
.combo-covers img:last-child{transform:rotate(6deg)}
.combo h3{font-family:Cinzel,serif;font-size:1.5rem;margin:6px 0}
.combo p{color:var(--muted)}
.combo .right{text-align:right}
.strike{text-decoration:line-through;color:var(--muted);font-size:.9rem}
.save{display:inline-block;margin-top:6px;font-size:.78rem;color:#cfe8b8;background:#22301e;padding:3px 9px;border-radius:999px}

/* quote band */
.quote{padding:76px 0;text-align:center;background:linear-gradient(180deg,#10172a,#0b0f1a);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.quote blockquote{font-family:Lora,serif;font-style:italic;font-size:clamp(1.3rem,2.6vw,1.9rem);max-width:820px;margin:0 auto;color:#efe5cd;line-height:1.45}
.quote cite{display:block;margin-top:18px;font-style:normal;color:var(--gold);font-size:.86rem;letter-spacing:.14em;text-transform:uppercase}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:s}
.step{border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px;background:var(--night-2);position:relative}
.step::before{counter-increment:s;content:counter(s);font-family:Cinzel,serif;font-weight:700;font-size:1.05rem;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--gold);color:var(--gold-2);margin-bottom:16px}
.step h4{font-size:1.02rem;margin-bottom:6px}
.step p{color:var(--muted);font-size:.9rem}

/* author */
.author{display:grid;grid-template-columns:320px 1fr;gap:56px;align-items:center}
.portrait{aspect-ratio:4/5;border-radius:var(--radius);border:1px solid var(--line);background:radial-gradient(240px 200px at 50% 35%,rgba(227,179,76,.22),transparent 70%),var(--night-2);display:grid;place-items:center;text-align:center;color:var(--muted);font-size:.82rem;padding:20px}
.portrait .mono{font-family:Cinzel,serif;font-size:4.2rem;color:var(--gold-2);line-height:1;margin-bottom:12px}
.author h2{font-family:Cinzel,serif;font-size:2.2rem;margin:10px 0 18px}
.author p{color:#d6cfbe;margin-bottom:14px;font-family:Lora,serif;font-size:1.04rem}
.creds{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.creds span{font-size:.8rem;border:1px solid var(--line);padding:6px 12px;border-radius:999px;color:var(--muted)}

/* faq */
.faq{max-width:760px;margin:0 auto}
details{border-bottom:1px solid var(--line);padding:20px 4px}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:20px;font-size:1.02rem}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--gold);font-size:1.4rem;line-height:1;transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details p{color:var(--muted);margin-top:10px;font-size:.95rem}

footer{border-top:1px solid var(--line);padding:42px 0 50px;color:var(--muted);font-size:.86rem}
.foot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center}
.foot .verse{font-family:Lora,serif;font-style:italic}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(3,5,10,.66);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.overlay.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--night-2);border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line)}
.dr-head h3{font-family:Cinzel,serif;font-size:1.2rem}
.x{background:none;border:0;color:var(--muted);font-size:1.6rem;cursor:pointer;line-height:1;padding:4px 8px}
.x:hover{color:var(--ink)}
.dr-items{flex:1;overflow:auto;padding:12px 24px}
.empty{text-align:center;color:var(--muted);padding:60px 10px}
.empty svg{width:42px;height:42px;color:var(--gold);opacity:.6;margin:0 auto 12px}
.line{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.line img{width:52px;border-radius:3px;aspect-ratio:2/3;object-fit:cover}
.line b{font-size:.92rem;display:block;line-height:1.3}
.line small{color:var(--gold-2);font-weight:600}
.rm{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.8rem;text-decoration:underline}
.rm:hover{color:#f0a0a0}
.dr-foot{padding:20px 24px 24px;border-top:1px solid var(--line);background:#0e1322}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.tot b{font-family:Cinzel,serif;font-size:1.5rem;color:var(--gold-2)}
.hint{font-size:.8rem;color:#cfe8b8;min-height:1.2em;margin-bottom:12px}
.field{width:100%;background:var(--night);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px 14px;font:inherit;font-size:.92rem;margin-bottom:12px}
.field:focus{outline:none;border-color:var(--gold)}
.btn-wa{width:100%;background:#25d366;color:#05230f;box-shadow:0 6px 22px -8px rgba(37,211,102,.6)}
.btn-wa[aria-disabled=true]{opacity:.45;pointer-events:none}
.btn-wa svg{width:20px;height:20px}
.fine{font-size:.76rem;color:var(--muted);margin-top:12px;text-align:center}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}
.modal.on{opacity:1;pointer-events:auto}
.modal-box{position:relative;background:var(--night-2);border:1px solid var(--line);border-radius:18px;max-width:880px;width:100%;max-height:90vh;overflow:auto;display:grid;grid-template-columns:280px 1fr;gap:34px;padding:34px}
.modal-box .x{position:absolute;top:12px;right:12px}
.modal-box img{border-radius:5px;box-shadow:0 20px 40px -16px #000}
.modal-box h3{font-family:Cinzel,serif;font-size:1.7rem;line-height:1.15;margin:8px 0 6px}
.modal-box .sub{font-family:Lora,serif;font-style:italic;color:#cfc7b5;margin-bottom:16px}
.modal-box .syn{color:#d6cfbe;font-family:Lora,serif;margin-bottom:18px}
.modal-box h5{font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:18px 0 10px}
.modal-box ul{list-style:none;columns:1;font-size:.9rem;color:var(--muted)}
.modal-box li{padding:5px 0 5px 20px;position:relative;break-inside:avoid}
.modal-box li::before{content:"";position:absolute;left:2px;top:13px;width:8px;height:1px;background:var(--gold)}
.modal-buy{display:flex;align-items:center;gap:20px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:var(--ink);color:#1a1205;padding:12px 20px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;transition:all .3s;z-index:70;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:920px){
  .hero-grid,.author{grid-template-columns:1fr}
  .fan{height:360px;max-width:440px;margin:0 auto;width:100%}
  .grid{grid-template-columns:1fr;max-width:440px;margin:0 auto}
  .steps{grid-template-columns:1fr 1fr}
  .combo{grid-template-columns:1fr;text-align:center;padding:30px 24px}
  .combo-covers{justify-content:center}
  .combo .right{text-align:center}
  .nav-links{display:none}
  .portrait{max-width:300px;margin:0 auto;width:100%}
  .modal-box{grid-template-columns:1fr;padding:26px}
  .modal-box img{max-width:200px;margin:0 auto}
}
@media (max-width:520px){
  .steps{grid-template-columns:1fr}
  .brand small{display:none}
  section{padding:64px 0}
  .hero{padding:52px 0 64px}
}
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="brand" href="#inicio">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#e3b34c" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M6 9h12"/></svg></span>
      <span><b data-t="brand.name"></b><small data-t="brand.tagline"></small></span>
    </a>
    <nav class="nav-links">
      <a href="#livros">Livros</a><a href="#como-comprar">Como comprar</a><a href="#autor">O autor</a><a href="#duvidas">Dúvidas</a>
    </nav>
    <a class="cart-btn" href="#livros" style="text-decoration:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg>
      Comprar
    </a>
  </div>
</header>

<main id="inicio">
<div class="hero">
  <div class="stars"></div>
  <div class="wrap hero-grid">
    <div>
      <span class="eyebrow" data-t="hero.eyebrow"></span>
      <h1><span data-t="hero.title"></span> <em data-t="hero.highlight"></em> <span data-t="hero.title_end"></span></h1>
      <p class="lead" data-t="hero.lead"></p>
      <div class="hero-cta">
        <a class="btn btn-gold" href="#livros" data-t="hero.button_main"></a>
        <a class="btn btn-ghost" href="#colecao" id="heroCombo" data-t="hero.button_second"></a>
      </div>
      <div class="hero-note" id="badges"></div>
    </div>
    <div class="fan" id="fan"></div>
  </div>
</div>

<section id="livros">
  <div class="wrap">
    <div class="sec-head">
      <span class="eyebrow" data-t="collection.eyebrow"></span>
      <h2 data-t="collection.title"></h2>
      <p data-t="collection.lead"></p>
      <div class="divider">✦</div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="combo" id="colecao">
      <div class="combo-covers" id="comboCovers"></div>
      <div>
        <span class="eyebrow" data-t="combo.eyebrow"></span>
        <h3 data-t="combo.title"></h3>
        <p data-t="combo.text"></p>
      </div>
      <div class="right">
        <div class="strike" id="comboFrom"></div>
        <div class="price" id="comboPrice"></div>
        <div class="save" id="comboSave"></div>
        <div style="margin-top:14px"><a class="btn btn-gold add" id="comboBuy" href="#" data-t="combo.button"></a></div>
      </div>
    </div>
  </div>
</section>

<div class="quote">
  <div class="wrap">
    <blockquote id="quoteText"></blockquote>
    <cite data-t="quote.cite"></cite>
  </div>
</div>

<section id="como-comprar">
  <div class="wrap">
    <div class="sec-head">
      <span class="eyebrow" data-t="howto.eyebrow"></span>
      <h2 data-t="howto.title"></h2>
      <p data-t="howto.lead"></p>
      <div class="divider">✦</div>
    </div>
    <div class="steps" id="steps"></div>
  </div>
</section>

<section id="autor" style="background:linear-gradient(180deg,transparent,rgba(26,34,56,.45),transparent)">
  <div class="wrap author">
    <div class="portrait" style="padding:0;overflow:hidden"><img id="authorPhoto" alt="" style="width:100%;height:100%;object-fit:cover"></div>
    <div>
      <span class="eyebrow" data-t="author.eyebrow"></span>
      <h2 data-t="author.name"></h2>
      <div id="authorText"></div>
      <div class="creds" id="creds"></div>
    </div>
  </div>
</section>

<section id="duvidas">
  <div class="wrap">
    <div class="sec-head">
      <span class="eyebrow" data-t="faq.eyebrow"></span>
      <h2 data-t="faq.title"></h2>
      <div class="divider">✦</div>
    </div>
    <div class="faq" id="faq"></div>
  </div>
</section>
</main>

<footer>
  <div class="wrap foot">
    <div><b class="display" style="color:var(--ink)" data-t="brand.name"></b><br>Suporte: <span data-t="footer.email"></span> · WhatsApp <span data-t="footer.whatsapp"></span><br>© <span id="yr"></span> · Todos os direitos reservados</div>
    <div class="verse" data-t="footer.verse"></div>
  </div>
</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-box" id="modalBox"></div></div>

<script src="/content-default.js"></script>
<script>
const brl = v => Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get = (o, p) => p.split(".").reduce((a,k)=>a?.[k], o);
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12l5 5L20 6"/></svg>';
const ico = {
  pages:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>',
  pdf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/></svg>'
};
let C = null;

function render(c){
  C = c;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = get(c, el.dataset.t) ?? "");
  document.title = `${c.brand.name} — ${c.brand.tagline}`;
  const books = c.books || [];
  $("#badges").innerHTML = (c.hero.badges||[]).map(b=>`<span>${CHECK}${esc(b)}</span>`).join("");
  const fan = books.slice(-3);
  const order = fan.length===3 ? [fan[0],fan[2],fan[1]] : fan;
  $("#fan").innerHTML = order.map((b,i)=>`<img class="f${fan.length===3?[1,2,3][i]:i+1}" src="${esc(b.img)}" alt="Capa: ${esc(b.title)}">`).join("");
  $("#grid").innerHTML = books.map((b,i)=>`
    <article class="card">
      <div class="cover-box">
        ${b.tag?`<span class="tag">${esc(b.tag)}</span>`:""}
        <img src="${esc(b.img)}" alt="Capa de ${esc(b.title)}" data-details="${i}">
      </div>
      <div class="card-body">
        <span class="vol">${esc(b.vol)}</span>
        <h3>${esc(b.title)}</h3>
        <p class="sub">${esc(b.sub)}</p>
        <p class="desc">${esc(b.desc)}</p>
        <button class="link-btn" data-details="${i}">Ver detalhes e capítulos</button>
        <div class="meta">${b.pages?`<span>${ico.pages}${esc(b.pages)} páginas</span>`:""}<span>${ico.pdf}PDF</span></div>
        <div class="buy">
          <div class="price"><small>E-BOOK</small>${brl(b.price)}</div>
          <a class="btn btn-gold add" href="${esc(b.checkout)}">Comprar</a>
        </div>
      </div>
    </article>`).join("");
  const showCombo = c.combo && c.combo.show !== false;
  $("#colecao").style.display = showCombo ? "" : "none";
  $("#heroCombo").style.display = showCombo ? "" : "none";
  if (showCombo){
    const sum = books.reduce((a,b)=>a+Number(b.price||0),0);
    $("#comboCovers").innerHTML = books.slice(0,3).map(b=>`<img src="${esc(b.img)}" alt="">`).join("");
    $("#comboFrom").textContent = sum > c.combo.price ? "de " + brl(sum) : "";
    $("#comboPrice").textContent = brl(c.combo.price);
    $("#comboSave").textContent = sum > c.combo.price ? "economize " + brl(sum - c.combo.price) : "";
    $("#comboSave").style.display = sum > c.combo.price ? "" : "none";
    $("#comboBuy").href = c.combo.checkout;
  }
  $("#quoteText").textContent = `“${c.quote.text}”`;
  $("#steps").innerHTML = (c.howto.steps||[]).map(s=>`<div class="step"><h4>${esc(s.title)}</h4><p>${esc(s.text)}</p></div>`).join("");
  $("#authorPhoto").src = c.author.photo; $("#authorPhoto").alt = c.author.name;
  $("#authorText").innerHTML = (c.author.paragraphs||[]).map(p=>`<p>${esc(p)}</p>`).join("");
  $("#creds").innerHTML = (c.author.creds||[]).map(x=>`<span>${esc(x)}</span>`).join("");
  $("#faq").innerHTML = (c.faq.items||[]).map(f=>`<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join("");
  $("#yr").textContent = new Date().getFullYear();
}

function details(i){
  const b = C.books[i];
  $("#modalBox").innerHTML = `
    <button class="x" data-close aria-label="Fechar">×</button>
    <img src="${esc(b.img)}" alt="Capa de ${esc(b.title)}">
    <div>
      <span class="vol eyebrow">${esc(b.vol)}${b.pages?` · ${esc(b.pages)} páginas`:""}</span>
      <h3>${esc(b.title)}</h3>
      <p class="sub">${esc(b.sub)}</p>
      <p class="syn">${esc(b.syn)}</p>
      ${(b.toc||[]).length?`<h5>O que você vai encontrar</h5><ul>${b.toc.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}
      <div class="modal-buy"><div class="price">${brl(b.price)}</div><a class="btn btn-gold add" href="${esc(b.checkout)}">Comprar agora</a></div>
    </div>`;
  $("#modal").classList.add("on");
}
const closeAll = () => $("#modal").classList.remove("on");
document.addEventListener("click", e => {
  if (e.target.id === "modal") return closeAll();
  const t = e.target.closest("[data-details],[data-close]");
  if (!t) return;
  if (t.dataset.details !== undefined) details(+t.dataset.details); else closeAll();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeAll(); });

// 1) mostra na hora a última versão vista (ou a padrão); 2) busca a versão salva no admin
let cached = null;
try { cached = JSON.parse(localStorage.getItem("site-content") || "null"); } catch(e) {}
render(cached || window.DEFAULT_CONTENT);
fetch(`${SITE_CONFIG.supabaseUrl}/rest/v1/site_content?id=eq.main&select=data`, {
  headers: { apikey: SITE_CONFIG.supabaseKey }
}).then(r => r.ok ? r.json() : null).then(rows => {
  const data = rows && rows[0] && rows[0].data;
  if (!data) return;
  try { localStorage.setItem("site-content", JSON.stringify(data)); } catch(e) {}
  render(data);
}).catch(() => {});
</script>
</body>
</html>
